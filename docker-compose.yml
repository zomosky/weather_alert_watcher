name: weather_alert_watcher

x-runtime: &runtime
  image: weather-alert-watcher-api:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://weather:${POSTGRES_PASSWORD:-weather}@db:5432/weather
    WARNING_PROVIDER: ${WARNING_PROVIDER:-cma}
    FORECAST_PROVIDER: ${FORECAST_PROVIDER:-openmeteo}
    FALLBACK_TO_MOCK_ON_FAILURE: ${FALLBACK_TO_MOCK_ON_FAILURE:-false}
  restart: unless-stopped
  init: true

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *runtime
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *runtime
    command: ["python", "-m", "worker.app.worker"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; from pathlib import Path; p=Path('/tmp/weather-worker-health'); assert p.exists() and time.time()-p.stat().st_mtime < max(120,int(os.getenv('REFRESH_INTERVAL_MINUTES','30'))*120)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pg_data:
