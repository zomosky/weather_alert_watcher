;mso-border-bottom-alt:none;mso-border-between:none"><span style="font-family:微软雅黑;font-size:12pt;color:#000000;mso-style-textfill-fill-color:#000000">由于冻雨范围减小，强度减弱，因此解除冰冻黄色预警。但预计，1月22日08时至23日08时，湖南南部、广西西北部局地仍有冻雨或冰粒。</span></p><p class="wza" style="text-indent:0;text-align:justify;mso-pagination:none;mso-csssas11-rule:exactly;margin-top:0pt;margin-bottom:0pt;border:none;mso-border-left-alt:none;mso-border-top-alt:none;mso-border-right-alt:none;mso-border-bottom-alt:none;mso-border-between:none"> </p><p class="wza" style="text-indent:0;text-align:justify;mso-pagination:none;mso-csssas11-rule:exactly;margin-top:0pt;margin-bottom:0pt;border:none;mso-border-left-alt:none;mso-border-top-alt:none;mso-border-right-alt:none;mso-border-bottom-alt:none;mso-border-between:none"><span style="font-family:微软雅黑;font-size:12pt;color:#000000;mso-style-textfill-fill-color:#000000"><b>防御指南：</b></span></p><p class="wza" style="text-indent:0;text-align:justify;mso-pagination:none;mso-csssas11-rule:exactly;margin-top:0pt;margin-bottom:0pt;border:none;mso-border-left-alt:none;mso-border-top-alt:none;mso-border-right-alt:none;mso-border-bottom-alt:none;mso-border-between:none"><span style="font-family:微软雅黑;font-size:12pt;color:#000000;mso-style-textfill-fill-color:#000000">1、</span><span style="font-family:微软雅黑;font-size:12pt;color:#000000;mso-style-textfill-fill-color:#000000">交通、公安等部门要按照职责做好道路结冰应对准备工作</span><span style="font-family:微软雅黑;font-size:12pt;color:#000000;mso-style-textfill-fill-color:#000000">；</span></p><p class="wza" style="text-indent:0;text-align:justify;mso-pagination:none;mso-csssas11-rule:exactly;margin-top:0pt;margin-bottom:0pt;border:none;mso-border-left-alt:none;mso-border-top-alt:none;mso-border-right-alt:none;mso-border-bottom-alt:none;mso-border-between:none"><span style="font-family:微软雅黑;font-size:12pt;color:#000000;mso-style-textfill-fill-color:#000000">2</span><span style="font-family:微软雅黑;font-size:12pt;color:#000000;mso-style-textfill-fill-color:#000000">、</s
