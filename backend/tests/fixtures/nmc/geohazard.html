<div id="text" style="min-height:500px;"><div class="title"> 地质灾害气象风险预警 </div><div class="author"><b>2026</b> 年 <b>09</b> 月 <b>29</b> 日 <b>18</b> 时  </div><hr color="red"/><div class="writing"><p class="wza" style="text-indent:0;text-align:justify;mso-pagination:none;mso-csssas11-rule:exactly;margin-top:0pt;margin-bottom:0pt;border:none;mso-border-left-alt:none;mso-border-top-alt:none;mso-border-right-alt:none;mso-border-bottom-alt:none;mso-border-between:none"><span style="font-family:微软雅黑;font-size:15pt;color:#000000;mso-style-textfill-fill-color:#000000"><b>自然资源部与中国气象局</b></span><span style="font-family:微软雅黑;font-size:15pt;color:#000000;mso-style-textfill-fill-color:#000000"><b>9月29日18时</b></span><span style="font-family:微软雅黑;font-size:15pt;color:#000000;mso-style-textfill-fill-color:#000000"><b>联合发布</b></span><span style="font-family:微软雅黑;font-size:15pt;color:#000000;mso-style-textfill-fill-color:#000000"><b>黄</b></span><span style="font-family:微软雅黑;font-size:15pt;color:#000000;mso-style-textfill-fill-color:#000000"><b>色</b></span><span style="font-family:微软雅黑;font-size:15pt;color:#000000;mso-style-textfill-fill-color:#000000"><b>地质灾害气象风险预警：</b></span></p><p class="wza" style="text-indent:28pt;text-align:justify;mso-pagination:none;mso-csssas11-rule:exactly;margin-top:0pt;margin-bottom:0pt;border:none;mso-border-left-alt:none;mso-border-top-alt:none;mso-border-right-alt:none;mso-border-bottom-alt:none;mso-border-between:none"><span style="font-family:微软雅黑;font-size:14pt;color:#000000;mso-style-textfill-fill-color:#000000">预计，</span><span style="font-family:微软雅黑;font-size:14pt;color:#000000;mso-style-textfill-fill-color:#000000">9月29日20时至30日20时</span><span style="font-family:微软雅黑;font-size:14pt;color:#000000;mso-style-textfill-fill-color:#000000">，</span><span style="font-family:微软雅黑;font-size:14pt;color:#000000;mso-style-textfill-fill-color:#000000">湖北西部、重庆北部和南部、西藏南部、陕西南部等地部分地区发生地质灾害的气象风险较高（黄色预警）</span><span style="font-family:微软雅黑;font-size:14pt;color:#000000;mso-style-textfill-fill-color:#000000">。</span><span style="font-family:微软雅黑;font-size:14pt;color:#000000;mso-style-textfill-fill-color:#000000">各级政府及有关部门按照应急预案做好地质灾害防御工作。请社会公众及时关注地质灾害气象风险预警信息，谨慎前往地质灾害预警区域</span><span style="font-family:微软雅黑;font-size:14pt;color:#000000;mso-style-textfill-fill-color:#000000">。</span><span style="font-family:微软雅黑;font-size:14pt;color:#000000;mso-style-textfill-fill-color:#000000">黄色预警区内人员，请随时关注预警信息变化，注意附近警示标志，避免在沟谷、斜坡、陡崖（坎）等高风险地带逗留</span><span style="font-family:微软雅黑;font-size:14pt;color:#000000;mso-style-textfill-fill-color:#000000">。</span></p><p class="wza" style="text-indent:0;text-align:center;mso-pagination:none;margin-top:0pt;margin-bottom:0pt;border:none;border-left:none;border-top:none;border-right:none;border-bottom:none;mso-border-between:none"><a name="tu1" style="text-align:center;mso-pagination:none;margin-top:0pt;margin-bottom:0pt;border:none;border-left:none;border-top:none;border-right:none;border-bottom:none;mso-border-between:none"><span style="font-family:微软雅黑;font-size:14pt;color:#000000;mso-style-textfill-fill-color:#000000"><img height="679.5" src="https://image.nmc.cn/product/2026/09/29/GOFC/SEVP_NMC_GOFC_SFER_EME_ACHN_L88_P9_20260929100002400_base64_1.jpg?v=1790676002241" style="max-width:100%;" width="820.5"/><br/></span></a></p></div></div>
