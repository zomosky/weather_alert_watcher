name: Backend regression checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "backend/**"
      - "conftest.py"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "backend/**"
      - "conftest.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: "sqlite:///:memory:"
      AI_PROVIDER: none
      OPENAI_API_KEY: ""
      QWEATHER_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.0"
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: uv sync --frozen --group dev
      - name: Run offline backend regression tests
        run: uv run --offline --no-sync pytest backend/tests -q --tb=short
